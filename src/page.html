<!doctype html>
<html class="{{theme}}">
<head>
<meta charset="utf-8">
<!-- Markdown may hold raw HTML: only our nonced script runs, no inline handlers, fetches stay local. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src 'unsafe-inline'; img-src * md: data:; media-src * md:; font-src md: data:; connect-src md:; base-uri md:">
<base id="base">
<title>{{title}}</title>
<style>
{{css}}
:root { --bg: #ffffff; --fg: #1f2328; --border: #d1d9e0; --active: #818b981f; --focus: #0969da; }
.dark { --bg: #0d1117; --fg: #f0f6fc; --border: #3d444d; --active: #656c7633; --focus: #4493f8; color-scheme: dark; }
html, body { margin: 0; height: 100%; }
body { display: flex; background: var(--bg); }
#tree { width: 260px; flex-shrink: 0; overflow: auto; padding: 8px 4px; box-sizing: border-box; border-right: 1px solid var(--border);
  font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: var(--fg); }
#tree ul { list-style: none; margin: 0; padding-left: 12px; }
#tree > ul { padding-left: 0; }
#tree a, #tree summary { display: block; padding: 3px 8px; border-radius: 6px; color: inherit; text-decoration: none; white-space: nowrap; cursor: pointer; }
#tree a:hover, #tree summary:hover, #tree a.active { background: var(--active); }
#tree summary { list-style: none; }
#tree summary::-webkit-details-marker { display: none; }
#tree summary::before { content: '▸'; display: inline-block; width: 1em; }
#tree details[open] > summary::before { content: '▾'; }
#tree a { padding-left: calc(8px + 1em); }
#tree :focus { outline: 2px solid var(--focus); outline-offset: -2px; }
#content { flex: 1; overflow: auto; outline: none; }
.markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 32px 45px; }
</style>
<script nonce="{{nonce}}">
// In <head> so a doc with broken HTML (e.g. an unclosed comment) can't swallow the script.
document.addEventListener('DOMContentLoaded', () => {
  const tree = document.getElementById('tree'), content = document.getElementById('content');
  const article = content.firstElementChild, base = document.getElementById('base');
  const isDoc = u => u.protocol === location.protocol && /\.(md|markdown)$/i.test(u.pathname);
  const same = (a, b) => decodeURIComponent(a.pathname) === decodeURIComponent(b.pathname);
  const byId = id => article.querySelector('#' + CSS.escape(id)); // doc headings only, not the shell's ids
  let current;

  // Highlight the doc in the tree and expand its parent folders.
  function mark(u) {
    for (const a of tree.querySelectorAll('a')) a.classList.toggle('active', same(new URL(a.href), u));
    for (let d = tree.querySelector('a.active')?.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
  }

  // Swap in another doc without reloading, so the tree keeps its state.
  async function show(u) {
    current = u.href;
    const res = await fetch(u.pathname + '?body');
    const html = await res.text();
    if (current !== u.href) return; // a newer request won
    base.href = u.href; // relative images/links resolve against the doc
    article.innerHTML = html;
    mark(u);
    const target = u.hash && byId(decodeURIComponent(u.hash.slice(1)));
    target ? target.scrollIntoView() : content.scrollTop = 0;
  }

  // Every link goes through here: docs swap in, anchors scroll, the rest goes to Rust,
  // which opens web links in the browser and local images/PDFs in their app.
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    e.preventDefault();
    const raw = a.getAttribute('href');
    if (raw.startsWith('#')) return byId(decodeURIComponent(raw.slice(1)))?.scrollIntoView(); // base points elsewhere
    const u = new URL(a.href);
    isDoc(u) ? show(u) : window.ipc.postMessage(u.href);
  });

  // Items not inside a collapsed folder (closed <details> keep layout boxes, so no offsetParent check).
  const shown = el => !el.closest('details:not([open]) > ul');
  const visible = () => [...tree.querySelectorAll('summary, a')].filter(shown);
  function move(el) {
    if (!el) return;
    el.focus();
    if (el.tagName === 'A') show(new URL(el.href));
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === '1') { // focus the open doc, or the first item if its folder is collapsed
      e.preventDefault();
      const a = tree.querySelector('a.active');
      (a && shown(a) ? a : visible()[0])?.focus();
      return;
    }
    if (e.ctrlKey && e.key === '2') { e.preventDefault(); content.focus(); return; }
    if (!tree.contains(document.activeElement) || e.ctrlKey || e.altKey) return;
    const list = visible(), i = list.indexOf(document.activeElement), el = list[i];
    if (!el) return;
    const dir = el.tagName === 'SUMMARY' ? el.parentElement : null;
    switch (e.key) {
      case 'ArrowDown': move(list[i + 1]); break;
      case 'ArrowUp': move(list[i - 1]); break;
      case 'ArrowRight': if (dir && !dir.open) dir.open = true; else move(list[i + 1]); break;
      case 'ArrowLeft': // collapse, or jump to the parent folder
        if (dir && dir.open) dir.open = false;
        else el.parentElement.parentElement.closest('details')?.querySelector('summary').focus();
        break;
      case 'Enter': if (dir) return; show(new URL(el.href)); content.focus(); break;
      default: return;
    }
    e.preventDefault();
  });

  mark(new URL(location.href));
  content.focus();
});
</script>
</head>
<body>
<nav id="tree">{{tree}}</nav>
<main id="content" tabindex="-1"><article class="markdown-body">{{content}}</article></main>
</body>
</html>
