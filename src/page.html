<!doctype html>
<html class="{{theme}}">
<head>
<meta charset="utf-8">
<!-- Markdown may hold raw HTML: only our nonced script runs, no inline handlers, fetches stay local. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src 'unsafe-inline'; img-src * md: data:; media-src * md:; font-src md: data:; connect-src md:; base-uri md:">
<base id="base">
<title>{{title}}</title>
<style>
{{css}}
/* GitHub's font lists start with Mac and Windows fonts. On Linux each missing one costs WebKit a fontconfig lookup
   per font size and weight (~200 ms on a typical README), so start at the first font Linux has. */
.markdown-body { font-family: "Noto Sans", Helvetica, Arial, sans-serif; }
.markdown-body tt, .markdown-body code, .markdown-body kbd, .markdown-body samp, .markdown-body pre { font-family: "Liberation Mono", monospace; }
:root { --bg: #ffffff; --tree-bg: #f6f8fa; --fg: #1f2328; --border: #d1d9e0; --active: #818b981f; --focus: #0969da; }
.dark { --bg: #0d1117; --tree-bg: #010409; --fg: #f0f6fc; --border: #3d444d; --active: #656c7633; --focus: #4493f8; color-scheme: dark; }
html, body { margin: 0; height: 100%; }
body { display: flex; background: var(--bg); }
#tree { width: 260px; flex-shrink: 0; overflow: auto; padding: 8px 4px; box-sizing: border-box; border-right: 1px solid var(--border); background: var(--tree-bg);
  font: 14px "Noto Sans", Helvetica, Arial, sans-serif; color: var(--fg); }
#tree ul { list-style: none; margin: 0; padding-left: 12px; }
#tree > ul { padding-left: 0; }
#tree a, #tree summary { display: block; padding: 3px 8px; border-radius: 6px; color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
#tree a:hover, #tree summary:hover { background: var(--active); }
#tree a.active { background: var(--active); font-weight: 600; box-shadow: inset 2px 0 var(--focus); }
#tree summary { list-style: none; }
#tree summary::-webkit-details-marker { display: none; }
#tree summary::before { content: '▸'; display: inline-block; width: 1.18em; font-size: .85em; /* 1.18 × .85 ≈ 1em, aligns with file padding */ opacity: .6; }
#tree details[open] > summary::before { content: '▾'; }
#tree a { padding-left: calc(8px + 1em); }
#tree :focus { outline: 2px solid var(--focus); outline-offset: -2px; }
#content { flex: 1; overflow: auto; outline: none; }
.markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 32px 45px; }
@media (max-width: 767px) { .markdown-body { padding: 15px; } }
</style>
<script nonce="{{nonce}}">
// In <head> so a doc with broken HTML (e.g. an unclosed comment) can't swallow the script.
document.addEventListener('DOMContentLoaded', () => {
  const tree = document.getElementById('tree'), content = document.getElementById('content');
  const article = content.firstElementChild, base = document.getElementById('base');
  const isDoc = u => u.protocol === location.protocol && /\.(md|markdown)$/i.test(u.pathname);
  const same = (a, b) => decodeURIComponent(a.pathname) === decodeURIComponent(b.pathname);
  const byId = id => article.querySelector('#' + CSS.escape(id)); // doc headings only, not the shell's ids
  let current = location.pathname === '/' ? null : location.href;

  // Highlight the doc in the tree and expand its parent folders.
  function mark(u) {
    for (const a of tree.querySelectorAll('a')) a.classList.toggle('active', same(new URL(a.href), u));
    for (let d = tree.querySelector('a.active')?.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
  }

  // Swap in another doc without reloading, so the tree keeps its state.
  // With reload, re-renders the open doc and keeps the scroll position.
  async function show(u, reload) {
    if (!reload) window.ipc.postMessage('watch ' + u.href); // before the fetch, so no save goes unseen
    current = u.href;
    const res = await fetch(u.pathname + '?body');
    const html = await res.text();
    if (current !== u.href) return; // a newer request won
    base.href = u.href; // relative images/links resolve against the doc
    article.innerHTML = html;
    if (reload) return;
    mark(u);
    const target = u.hash && byId(decodeURIComponent(u.hash.slice(1)));
    target ? target.scrollIntoView() : content.scrollTop = 0;
  }

  // Live reload, called by Rust's watches: the open doc was saved, or the tree changed (percent-encoded HTML).
  window.reload = () => { if (current) show(new URL(current), true); };
  window.setTree = encoded => {
    const path = d => { const p = []; for (; d; d = d.parentElement.closest('details')) p.unshift(d.firstElementChild.textContent); return p.join('/'); };
    const key = el => el.tagName === 'A' ? el.getAttribute('href') : path(el.parentElement); // a doc or a folder
    const open = new Set([...tree.querySelectorAll('details[open]')].map(path));
    const focused = tree.contains(document.activeElement) && key(document.activeElement);
    tree.innerHTML = decodeURIComponent(encoded);
    for (const d of tree.querySelectorAll('details')) d.open = open.has(path(d));
    if (current) mark(new URL(current));
    if (focused !== false) [...tree.querySelectorAll('summary, a')].find(el => key(el) === focused)?.focus();
  };

  // Every link goes through here: docs swap in, anchors scroll, the rest goes to Rust,
  // which opens web links in the browser and local images/PDFs in their app.
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    e.preventDefault();
    const raw = a.getAttribute('href');
    if (raw.startsWith('#')) return byId(decodeURIComponent(raw.slice(1)))?.scrollIntoView(); // base points elsewhere
    const u = new URL(a.href);
    isDoc(u) ? show(u) : window.ipc.postMessage(u.href);
  });

  // Items not inside a collapsed folder (closed <details> keep layout boxes, so no offsetParent check).
  const shown = el => !el.closest('details:not([open]) > ul');
  const visible = () => [...tree.querySelectorAll('summary, a')].filter(shown);
  function move(el) {
    if (!el) return;
    el.focus();
    if (el.tagName === 'A') show(new URL(el.href));
  }

  document.addEventListener('keydown', e => {
    // Ctrl+1, or Esc outside the tree: focus the open doc's tree entry, or the first item if its folder is collapsed
    if (e.ctrlKey && e.key === '1' || e.key === 'Escape' && !tree.contains(document.activeElement)) {
      e.preventDefault();
      const a = tree.querySelector('a.active');
      (a && shown(a) ? a : visible()[0])?.focus();
      return;
    }
    if (e.ctrlKey && e.key === '2') { e.preventDefault(); content.focus(); return; }
    if (e.ctrlKey && /^[wq]$/i.test(e.key)) { e.preventDefault(); window.ipc.postMessage('quit'); return; }
    if (!tree.contains(document.activeElement) || e.altKey) return;
    // PageUp/PageDown scroll the doc by a page (WebKit's own step), Ctrl+Up/Down by one text line.
    const page = content.clientHeight * 0.875, line = parseFloat(getComputedStyle(article).lineHeight);
    const dy = { PageDown: page, PageUp: -page, ArrowDown: e.ctrlKey && line, ArrowUp: e.ctrlKey && -line }[e.key];
    if (dy) { e.preventDefault(); content.scrollBy(0, dy); return; }
    if (e.ctrlKey) return;
    const list = visible(), i = list.indexOf(document.activeElement), el = list[i];
    if (!el) return;
    const dir = el.tagName === 'SUMMARY' ? el.parentElement : null;
    switch (e.key) {
      case 'ArrowDown': move(list[i + 1]); break;
      case 'ArrowUp': move(list[i - 1]); break;
      case 'ArrowRight': if (dir && !dir.open) dir.open = true; else move(list[i + 1]); break;
      case 'ArrowLeft': // collapse, or jump to the parent folder
        if (dir && dir.open) dir.open = false;
        else el.parentElement.parentElement.closest('details')?.querySelector('summary').focus();
        break;
      case 'Enter': if (dir) return; show(new URL(el.href)); content.focus(); break;
      default: return;
    }
    e.preventDefault();
  });

  mark(new URL(location.href));
  location.pathname === '/' ? visible()[0]?.focus() : content.focus(); // no doc open (md <dir>): start in the tree
});
</script>
</head>
<body>
<nav id="tree">{{tree}}</nav>
<main id="content" tabindex="-1"><article class="markdown-body">{{content}}</article></main>
</body>
</html>
