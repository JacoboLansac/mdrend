[package]
name = "mdrend"
version = "0.1.0"
edition = "2024"
description = "Fast GitHub-style markdown viewer for Linux, with a file tree and live reload"
license = "MIT"
repository = "https://github.com/JacoboLansac/mdrend"
readme = "README.md"
keywords = ["markdown", "viewer", "gtk", "webkit"]
categories = ["command-line-utilities", "gui"]

[dependencies]
comrak = "1.2.0"
gtk = "0.19"
ignore = "0.4.35"
percent-encoding = "2.3.2"
tao = { version = "0.38.0", default-features = false, features = ["rwh_06", "x11"] }
wry = "0.58.1"

[[bin]]
name = "md"
path = "src/main.rs"
